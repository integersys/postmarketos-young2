Section "Device"
    Identifier "Framebuffer"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
    Option "ShadowFB" "false"
EndSection

Section "Monitor"
    Identifier "Monitor0"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "Framebuffer"
    Monitor "Monitor0"
    DefaultDepth 24
    DefaultFbBpp 32
    SubSection "Display"
        Depth 24
        Virtual 320 960
    EndSubSection
EndSection

Section "InputDevice"
    Identifier "Young2 Touchscreen"
    Driver "evdev"
    Option "Device" "/dev/input/touchscreen-xlate"
    Option "SendCoreEvents" "true"
    # Y 1:1 is achieved in the translator (ABS_Y/ABS_MT_POSITION_Y range 0..480
    # to match the logical 320x480 screen) because this evdev (0.5.0) ignores
    # CoordinateTransformationMatrix.
EndSection

Section "ServerLayout"
    Identifier "Layout0"
    Screen "Screen0"
    InputDevice "Young2 Touchscreen" "SendCoreEvents"
EndSection
